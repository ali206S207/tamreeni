name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'manifest.json'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web deps
        run: npm install

      - name: Copy latest web app into Capacitor (single source of truth)
        run: |
          cp ../app.html www/index.html
          cp ../manifest.json www/manifest.json || true
          cp ../logo.png ../icon-192.png ../icon-512.png www/ || true
          rm -rf www/gifs && cp -r ../gifs www/gifs || true

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Decode release keystore
        run: |
          echo "${{ secrets.TAMREENI_KEYSTORE_BASE64 }}" | base64 -d > android/app/tamreeni-release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: mobile/android
        env:
          TAMREENI_KEYSTORE_PATH: tamreeni-release.keystore
          TAMREENI_KEYSTORE_PASSWORD: ${{ secrets.TAMREENI_KEYSTORE_PASSWORD }}
          TAMREENI_KEY_ALIAS: ${{ secrets.TAMREENI_KEY_ALIAS }}
          TAMREENI_KEY_PASSWORD: ${{ secrets.TAMREENI_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > /tmp/gradle_out.log 2>&1
          CODE=$?
          tail -n 400 /tmp/gradle_out.log
          if [ $CODE -ne 0 ]; then
            echo "::group::Gradle failure summary"
            grep -iE "error:|FAILED|what went wrong|could not|Exception|caused by" /tmp/gradle_out.log | tail -n 40 | while IFS= read -r line; do
              safe=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::${safe}"
            done
            echo "::endgroup::"
            exit $CODE
          fi

      - name: Remove keystore from workspace
        if: always()
        run: rm -f android/app/tamreeni-release.keystore

      - name: Rename APK with version
        working-directory: mobile
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/tamreeni-${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/tamreeni-latest.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamreeni-android-apk
          path: mobile/out/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: تمرينتي — أحدث نسخة أندرويد
          body: |
            آخر نسخة APK لتطبيق تمرينتي على أندرويد.
            حمّل الملف اللي اسمه tamreeni-latest.apk وثبّته على جهازك (لازم تسمح بالتثبيت من مصادر غير معروفة).
          files: mobile/out/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
